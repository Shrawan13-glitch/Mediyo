name: Build PR (Manual)
on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode Keystore
        run: echo ${{ secrets.DEBUG_KEYSTORE }} | base64 -d > app/debug.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-build-outputs: true

      - name: Build Debug APK
        run: ./gradlew assembleFossDebug --build-cache --stacktrace
        env:
          PULL_REQUEST: 'true'
          MUSIC_DEBUG_KEYSTORE_FILE: 'app/debug.jks'
          MUSIC_DEBUG_SIGNING_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          MUSIC_DEBUG_SIGNING_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/build/outputs/apk/foss/debug/*.apk