name: Fast Debug Build

on:
  push:
    branches:
      - dev
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-build-outputs: true

      - name: Build Debug APK
        run: ./gradlew assembleFossDebug --build-cache --stacktrace
        env:
          PULL_REQUEST: 'true'

      - name: Decode Keystore
        run: echo ${{ secrets.DEBUG_KEYSTORE }} | base64 -d > debug.jks

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/foss/debug/
          signingKey: ${{ secrets.DEBUG_KEYSTORE }}
          keyAlias: debug
          keyStorePassword: ${{ secrets.DEBUG_STORE_PASSWORD }}
          keyPassword: ${{ secrets.DEBUG_KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk