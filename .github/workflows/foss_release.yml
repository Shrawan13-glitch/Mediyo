name: Build FOSS Release (Manual)
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release name'
        required: true
        default: 'Mediyo v1.0.0'
      body:
        description: 'Release notes'
        required: true
        default: 'FOSS Release APK'
      draft:
        description: 'Draft release?'
        required: true
        default: 'false'
      prerelease:
        description: 'Pre-release?'
        required: true
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-build-outputs: true

      - name: Build FOSS Release APK
        run: ./gradlew assembleFossRelease --build-cache --stacktrace -DskipFormatKtlint
        env:
          PULL_REQUEST: "false"
          GRADLE_BUILD_CACHE_DIR: ~/.gradle/build-cache

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/foss/release/*.apk
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          body: ${{ github.event.inputs.body }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}